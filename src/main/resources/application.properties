
spring.application.name=gustavobarber

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracoes JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Administrador inicial
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# CORS (separar multiplas origens por virgula)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Perfil padrao
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Fuso horario da aplicacao
spring.jackson.time-zone=America/Fortaleza
